services:
  - type: web
    name: deadlineai-api
    runtime: node
    region: ohio
    plan: starter
    branch: main
    rootDir: apps/api
    buildCommand: cd ../../packages/db && npx prisma generate && cd ../../apps/api && npm install && npx tsc
    startCommand: cd apps/api && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        sync: false
      - key: UPSTASH_REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: FRONTEND_URL
        value: "https://web-i24hours-projects.vercel.app"
      - key: LITELLM_PROXY_URL
        sync: false
      - key: LITELLM_API_KEY
        sync: false
      - key: LITELLM_MODEL
        value: "gpt-4o-mini"
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_NAME
        sync: false
      - key: TELEGRAM_WEBHOOK_URL
        sync: false
      - key: CRON_INTERVAL_MS
        value: "60000"
