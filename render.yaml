services:
  - type: web
    name: deadlineai-api
    runtime: node
    region: ohio
    plan: starter
    branch: main
    rootDir: apps/api
    buildCommand: npm install -g prisma@5.15.0 && cd ../../packages/db && npm ci --include=dev && npx prisma generate && node scripts/db-push-direct.mjs && npm run build && cd ../../apps/api && npm ci --include=dev && npx tsc
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        sync: false
      - key: UPSTASH_REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: FRONTEND_URL
        value: "https://spacelink-mocha.vercel.app"
      # Amazon Bedrock Mantle → Kimi K2.5 (set BEDROCK_API_KEY in Render dashboard)
      - key: BEDROCK_API_KEY
        sync: false
      - key: BEDROCK_REGION
        value: "us-east-2"
      - key: BEDROCK_MODEL
        value: "moonshotai.kimi-k2.5"
      - key: BEDROCK_VISION_MODEL
        value: "moonshotai.kimi-k2.5"
      - key: BEDROCK_TOOL_MODEL
        value: "moonshotai.kimi-k2.5"
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_NAME
        sync: false
      - key: TELEGRAM_WEBHOOK_URL
        sync: false
      - key: CRON_INTERVAL_MS
        value: "60000"
